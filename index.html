  <style>
    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Variáveis de cor ───────────────────────────────── */
    :root {
      --preto:     #080808;
      --ouro:      #C8A020;
      --ouro-claro:#FFD700;
      --verde:     #2E8B2E;
      --verde-vivo:#4CAF50;
      --texto:     #f0e6c0;
    }

    /* ── Fundo e corpo ──────────────────────────────────── */
    html, body {
      min-height: 100%;
      background-color: var(--preto);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--texto);
    }

    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%,   rgba(200,160,32,.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(46,139,46,.12)  0%, transparent 60%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 48px;
    }

    /* ── Partículas (sparkle) ───────────────────────────── */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--ouro-claro);
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: .8; }
      90%  { opacity: .4; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* ── Wrapper central ────────────────────────────────── */
    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 20px;
    }

    /* ── Banner ─────────────────────────────────────────── */
    .banner-wrap {
      margin-top: 40px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(200,160,32,.4);
      box-shadow: 0 4px 32px rgba(0,0,0,.7), 0 0 16px rgba(200,160,32,.15);
    }
    .banner-wrap img { width: 100%; display: block; }

    /* ── Divisor ─────────────────────────────────────────── */
    .divider {
      margin: 32px 0 8px;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ouro), transparent);
      opacity: .6;
    }

    /* ── Subtítulo ───────────────────────────────────────── */
    .subtitle {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ouro-claro);
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255,215,0,.5);
    }

    /* ── Botões WhatsApp ─────────────────────────────────── */
    .buttons { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    .btn-whats {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--preto);
      background: linear-gradient(135deg, var(--ouro-claro) 0%, var(--ouro) 50%, #a07010 100%);
      border: 2px solid transparent;
      box-shadow: 0 4px 20px rgba(200,160,32,.4), inset 0 1px 0 rgba(255,255,255,.2);
      transition: transform .2s, box-shadow .2s, filter .2s;
      position: relative; overflow: hidden;
    }
    .btn-whats::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
      border-radius: inherit;
    }
    .btn-whats:active { transform: scale(.97); }
    @media (hover: hover) {
      .btn-whats:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(200,160,32,.6), inset 0 1px 0 rgba(255,255,255,.2);
        filter: brightness(1.1);
      }
    }

    /* ícone WhatsApp */
    .btn-whats .wa-icon {
      width: 26px; height: 26px; flex-shrink: 0;
    }
    .btn-whats span { position: relative; }

    /* ── Rodapé ──────────────────────────────────────────── */
    .footer {
      margin-top: 40px;
      font-size: .72rem;
      color: rgba(200,160,32,.4);
      letter-spacing: .06em;
      text-align: center;
    }
  </style>

<script>
  // Gera partículas douradas flutuantes
  (function() {
    var container = document.getElementById('particles');
    var count = 35;
    for (var i = 0; i < count; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = Math.random() * 3 + 1;
      p.style.cssText = [
        'width:'    + size + 'px',
        'height:'   + size + 'px',
        'left:'     + Math.random() * 100 + '%',
        'animation-duration:' + (Math.random() * 12 + 8) + 's',
        'animation-delay:'    + (Math.random() * -20)    + 's',
        'opacity:0'
      ].join(';');
      container.appendChild(p);
    }
  })();
